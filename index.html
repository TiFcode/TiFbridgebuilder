<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7b56f" />
    <title>TiFbridgebuilder · Construiește poduri</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">✦</span><div><h1>TiFbridgebuilder</h1><p>Construiește. Testează. Traversează!</p></div></div>
        <div class="level-pill">Nivelul 1 · Pârâul curcubeu</div>
      </header>
      <section class="play-area" aria-label="Scena jocului">
        <canvas id="game"></canvas>
        <div class="instruction-card"><span class="step-number">1</span><span id="instruction">Atinge două puncte luminoase pentru a pune o grindă.</span></div>
        <div class="bridge-meter" aria-live="polite"><span>REZISTENȚĂ</span><div class="meter-track"><i id="meter-fill"></i></div><strong id="meter-label">0%</strong></div>
        <div id="toast" class="toast" role="status"></div>
      </section>
      <footer class="controls">
        <div class="howto"><b>Cum joci</b><span>Unește punctele albastre. Creează drumul roz și adaugă triunghiuri dedesubt.</span></div>
        <div class="actions"><button class="secondary" id="undo" type="button">↶ Înapoi</button><button class="secondary" id="clear" type="button">↻ Curăță</button><button class="test" id="test" type="button">▶ Testează podul</button></div>
      </footer>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
